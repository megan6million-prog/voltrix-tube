AWSTemplateFormatVersion: '2010-09-09'
Description: Voltrix Platform - ECS Fargate + ALB (account 873938828708)

Resources:

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: voltrix-cluster-prod
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: voltrix-ecs-execution-role-prod
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, ssm:GetParameter, ssm:GetParameters]
                Resource: '*'

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: voltrix-ecs-task-role-prod
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VoltrixTaskPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:*']
                Resource: ['arn:aws:s3:::voltrix-*', 'arn:aws:s3:::voltrix-*/*']
              - Effect: Allow
                Action: ['cognito-idp:AdminGetUser','cognito-idp:AdminUpdateUserAttributes','cognito-idp:AdminAddUserToGroup','cognito-idp:AdminRemoveUserFromGroup']
                Resource: '*'
              - Effect: Allow
                Action: ['sqs:*']
                Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:voltrix-*'
              - Effect: Allow
                Action: ['mediaconvert:*','rekognition:*','transcribe:*','ivs:*']
                Resource: '*'
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue','secretsmanager:PutSecretValue','secretsmanager:CreateSecret']
                Resource: '*'
              - Effect: Allow
                Action: ['ce:GetCostAndUsage','ce:GetDimensionValues']
                Resource: '*'
              - Effect: Allow
                Action: ['cloudwatch:PutMetricData','logs:CreateLogGroup','logs:CreateLogStream','logs:PutLogEvents']
                Resource: '*'

  APILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /voltrix/api/prod
      RetentionInDays: 30

  VoltrixALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: voltrix-alb-prod
      Scheme: internet-facing
      Type: application
      Subnets:
        - subnet-0445a7df8f570dee1
        - subnet-0a54d94d3b8623d50
        - subnet-0ad69a00371c63c28
      SecurityGroups:
        - sg-0cab6180f5d4d0d07

  APITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: voltrix-api-tg-prod
      Port: 8080
      Protocol: HTTP
      VpcId: vpc-0587386f2020083ec
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref VoltrixALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  APITaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: voltrix-api-prod
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: voltrix-api
          Image: 873938828708.dkr.ecr.eu-west-1.amazonaws.com/voltrix-api:latest
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: production
            - Name: AWS_REGION
              Value: eu-west-1
            - Name: AWS_ACCOUNT_ID
              Value: '873938828708'
            - Name: COGNITO_USER_POOL_ID
              Value: eu-west-1_jxalwlttf
            - Name: COGNITO_CLIENT_ID
              Value: 7nvnsaaqj9boib1cvnrjrb19dl
            - Name: COGNITO_REGION
              Value: eu-west-1
            - Name: S3_RAW_UPLOADS
              Value: voltrix-raw-uploads-prod-873938828708
            - Name: S3_PROCESSED_VIDEOS
              Value: voltrix-processed-videos-prod-873938828708
            - Name: S3_THUMBNAILS
              Value: voltrix-thumbnails-prod-873938828708
            - Name: S3_SOUNDS
              Value: voltrix-sounds-prod-873938828708
            - Name: S3_CAPTIONS
              Value: voltrix-captions-prod-873938828708
            - Name: S3_DATA_LAKE
              Value: voltrix-data-lake-prod-873938828708
            - Name: S3_EXPORTS
              Value: voltrix-exports-prod-873938828708
            - Name: SQS_PAYMENT_WEBHOOKS
              Value: 'https://sqs.eu-west-1.amazonaws.com/873938828708/voltrix-payment-webhooks-prod.fifo'
            - Name: SQS_UPLOAD_JOBS
              Value: 'https://sqs.eu-west-1.amazonaws.com/873938828708/voltrix-upload-jobs-prod'
            - Name: SQS_NOTIFICATIONS
              Value: 'https://sqs.eu-west-1.amazonaws.com/873938828708/voltrix-notifications-prod'
            - Name: SQS_MISSING_CONTENT
              Value: 'https://sqs.eu-west-1.amazonaws.com/873938828708/voltrix-missing-content-prod'
            - Name: KINESIS_EVENTS_STREAM
              Value: voltrix-events
            - Name: ALLOWED_ORIGINS
              Value: '["*"]'
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: arn:aws:secretsmanager:eu-west-1:873938828708:secret:voltrix/database_url
            - Name: REDIS_URL
              ValueFrom: arn:aws:secretsmanager:eu-west-1:873938828708:secret:voltrix/redis_url
            - Name: SECRET_KEY
              ValueFrom: arn:aws:secretsmanager:eu-west-1:873938828708:secret:voltrix/secret_key
            - Name: CLOUDFRONT_DOMAIN
              ValueFrom: arn:aws:secretsmanager:eu-west-1:873938828708:secret:voltrix/cloudfront_domain
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /voltrix/api/prod
              awslogs-region: eu-west-1
              awslogs-stream-prefix: api
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -f http://localhost:8080/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3

  APIService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: voltrix-api-prod
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref APITaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - subnet-0fb1d3fa7d5e22dc4
            - subnet-054a0a31f87d58abb
          SecurityGroups:
            - sg-0023b1a519e406271
      LoadBalancers:
        - ContainerName: voltrix-api
          ContainerPort: 8080
          TargetGroupArn: !Ref APITargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 60

Outputs:
  ALBDNSName:
    Value: !GetAtt VoltrixALB.DNSName
    Export:
      Name: voltrix-alb-dns-prod

  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: voltrix-cluster-prod
